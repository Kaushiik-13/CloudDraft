<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudDraft canvas</title>
<style>
  :root {
    color-scheme: light;
    --ink: #202124;
    --muted: #6b7280;
    --panel: rgba(255, 255, 255, 0.94);
    --panel-border: rgba(15, 23, 42, 0.12);
    --accent: #635bff;
    --accent-soft: rgba(99, 91, 255, 0.14);
    --canvas: #f6f7f9;
    --dot: rgba(78, 86, 105, 0.24);
    --control-ink: #343741;
    --panel-hover: #f0f1f4;
    --editor: #ffffff;
    --diagram-canvas: #ffffff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #f3f4f6;
    --muted: #aeb4c0;
    --panel: rgba(28, 30, 36, 0.94);
    --panel-border: rgba(255, 255, 255, 0.13);
    --accent: #9a91ff;
    --accent-soft: rgba(154, 145, 255, 0.18);
    --canvas: #1e2025;
    --dot: rgba(211, 216, 228, 0.2);
    --control-ink: #e5e7eb;
    --panel-hover: #343740;
    --editor: #16181d;
    --diagram-canvas: #171717;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; min-width: 320px; overflow: hidden; background: var(--canvas); }
  body { font: 13px/1.4 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
  button { font: inherit; }
  #viewport {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 480px;
    overflow: hidden;
    background-color: var(--canvas);
    background-image: radial-gradient(circle, var(--dot) 1.15px, transparent 1.2px);
    background-size: 24px 24px;
    cursor: grab;
    user-select: none;
    touch-action: none;
    isolation: isolate;
  }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; inset: 0 auto auto 0; transform-origin: 0 0; will-change: transform; }
  #stage {
    position: relative;
    overflow: hidden;
    background: var(--diagram-canvas, #ffffff);
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12), 0 2px 8px rgba(15, 23, 42, 0.08);
  }
  #diagram, #nodes { position: absolute; inset: 0; width: 100%; height: 100%; }
  #diagram { display: block; user-select: none; pointer-events: none; }
  #nodes { overflow: visible; }
  #nodes button {
    position: absolute;
    appearance: none;
    padding: 0;
    border: 0;
    border-radius: 7px;
    color: transparent;
    touch-action: none;
  }
  #nodes .node-control {
    background-repeat: no-repeat;
    cursor: grab;
    will-change: transform;
  }
  #nodes .node-control:hover, #nodes .node-control:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    box-shadow: 0 0 0 6px var(--accent-soft);
  }
  #nodes .node-control.dragging {
    z-index: 3;
    cursor: grabbing;
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    box-shadow: 0 14px 28px rgba(35, 31, 100, 0.24), 0 0 0 7px var(--accent-soft);
  }
  #nodes .label-control {
    z-index: 4;
    min-width: 18px;
    min-height: 16px;
    border-radius: 4px;
    background: transparent;
    cursor: text;
  }
  #nodes .label-control:hover, #nodes .label-control:focus-visible {
    outline: 1.5px solid var(--accent);
    outline-offset: 2px;
    background: var(--accent-soft);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  #nodes .label-override {
    display: flex;
    align-items: center;
    padding: 1px 2px;
    color: var(--ink);
    white-space: pre-wrap;
    line-height: 1.25;
  }
  #nodes .label-override.align-left { justify-content: flex-start; text-align: left; }
  #nodes .label-override.align-center { justify-content: center; text-align: center; }
  .node-origin {
    position: absolute;
    z-index: 2;
    border: 1.5px dashed rgba(99, 91, 255, 0.52);
    border-radius: 7px;
    background: rgba(246, 247, 249, 0.88);
    pointer-events: none;
  }
  .node-origin.pending-origin { z-index: 1; border: 0; box-shadow: none; }
  .floating-panel {
    position: absolute;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    backdrop-filter: blur(14px);
  }
  .floating-panel button {
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--control-ink);
    cursor: pointer;
  }
  .floating-panel button:hover:not(:disabled) { background: var(--panel-hover); color: var(--ink); }
  .floating-panel button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .floating-panel button:disabled { opacity: 0.38; cursor: default; }
  .floating-panel svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #export-tools { top: 14px; right: 14px; }
  #zoom-tools { right: 14px; bottom: 14px; }
  #zoom-label { min-width: 46px; padding: 0 6px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  .divider { width: 1px; height: 22px; margin: 0 2px; background: var(--panel-border); }
  #status {
    position: absolute;
    z-index: 10;
    top: 14px;
    left: 14px;
    max-width: min(440px, calc(100% - 150px));
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    padding: 8px 11px;
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    background: var(--panel);
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    color: var(--muted);
    backdrop-filter: blur(14px);
  }
  #status-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.ready { color: var(--muted); }
  #status.busy::before {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 7px;
    border: 2px solid #c7c3ff;
    border-top-color: var(--accent);
    border-radius: 50%;
    content: "";
    animation: spin .7s linear infinite;
  }
  #empty-state {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-content: center;
    gap: 10px;
    color: var(--muted);
    text-align: center;
    pointer-events: none;
  }
  #empty-state strong { color: var(--ink); font-size: 15px; }
  #sample { pointer-events: auto; justify-self: center; border: 0; border-radius: 8px; padding: 8px 12px; background: var(--ink); color: white; cursor: pointer; }
  #label-editor {
    position: absolute;
    z-index: 8;
    min-width: 0;
    min-height: 0;
    resize: none;
    overflow: hidden;
    padding: 1px 2px;
    border: 0;
    border-bottom: 1.5px solid var(--accent);
    border-radius: 0;
    outline: 0;
    box-shadow: none;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.25;
    caret-color: var(--accent);
    user-select: text;
    touch-action: auto;
  }
  #code-panel {
    position: absolute;
    z-index: 20;
    top: 0;
    right: 0;
    display: flex;
    width: min(480px, 92vw);
    height: 100%;
    flex-direction: column;
    border-left: 1px solid var(--panel-border);
    background: var(--panel);
    box-shadow: -18px 0 50px rgba(15, 23, 42, 0.16);
    backdrop-filter: blur(18px);
  }
  #code-panel header, #code-panel footer { display: flex; align-items: center; gap: 8px; padding: 12px; }
  #code-panel header { border-bottom: 1px solid var(--panel-border); }
  #code-panel footer { justify-content: flex-end; border-top: 1px solid var(--panel-border); }
  #code-panel h2 { margin: 0 auto 0 0; font-size: 14px; }
  #code-panel button {
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 7px 10px;
    background: var(--editor);
    color: var(--ink);
    cursor: pointer;
  }
  #code-panel button.primary { border-color: var(--accent); background: var(--accent); color: white; }
  #code-editor {
    width: 100%;
    min-height: 0;
    flex: 1;
    resize: none;
    padding: 16px;
    border: 0;
    outline: 0;
    background: var(--editor);
    color: var(--ink);
    font: 12px/1.55 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    tab-size: 2;
  }
  #code-error { min-height: 1.4em; margin-right: auto; color: #dc2626; }
  .moon-icon { display: none; }
  :root[data-theme="dark"] .sun-icon { display: none; }
  :root[data-theme="dark"] .moon-icon { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    #viewport { min-height: 440px; }
    #status { top: 10px; left: 10px; max-width: calc(100% - 120px); }
    #export-tools { top: 10px; right: 10px; }
    #zoom-tools { right: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<main id="viewport" aria-label="CloudDraft architecture canvas" tabindex="0">
  <div id="world" hidden>
    <div id="stage">
      <img id="diagram" alt="Rendered cloud architecture">
      <div id="nodes"></div>
    </div>
  </div>
  <div id="empty-state">
    <strong>Preparing your architecture…</strong>
    <span>The canvas will fit automatically.</span>
    <button id="sample" hidden>Open example</button>
  </div>
  <div id="status" class="busy" role="status">
    <span id="status-text">Preparing canvas…</span>
  </div>
  <div id="export-tools" class="floating-panel" aria-label="Export diagram">
    <button id="png" disabled aria-label="Export PNG" title="Export PNG">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></svg>
    </button>
    <button id="json" disabled aria-label="View and edit JSON" title="View and edit diagram JSON">
      <svg viewBox="0 0 24 24"><path d="M8.5 4.5c-2 0-2 1.5-2 3v2c0 1.3-.7 2-2 2 1.3 0 2 .7 2 2v2c0 1.5 0 3 2 3M15.5 4.5c2 0 2 1.5 2 3v2c0 1.3.7 2 2 2-1.3 0-2 .7-2 2v2c0 1.5 0 3-2 3"/></svg>
    </button>
    <button id="reload" disabled aria-label="Reload latest diagram" title="Reload latest revision">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <span class="divider" aria-hidden="true"></span>
    <button id="theme" aria-label="Switch color theme" title="Switch light/dark theme">
      <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon-icon" viewBox="0 0 24 24"><path d="M20 15.4A8 8 0 0 1 8.6 4 8 8 0 1 0 20 15.4Z"/></svg>
    </button>
  </div>
  <div id="zoom-tools" class="floating-panel" aria-label="Canvas zoom">
    <button id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    <span class="divider"></span>
    <button id="fit" aria-label="Fit diagram" title="Fit diagram"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
  </div>
  <textarea id="label-editor" hidden aria-label="Edit diagram label" spellcheck="false"></textarea>
  <aside id="code-panel" hidden aria-label="Diagram JSON editor">
    <header>
      <h2>Diagram JSON</h2>
      <button id="download-json" title="Download JSON">Download</button>
      <button id="close-code" aria-label="Close code panel">Close</button>
    </header>
    <textarea id="code-editor" spellcheck="false" aria-label="Editable diagram JSON"></textarea>
    <footer>
      <span id="code-error" role="status"></span>
      <button id="format-code">Format</button>
      <button id="apply-code" class="primary">Apply changes</button>
    </footer>
  </aside>
</main>
<!-- canvas script -->
</body>
</html>
